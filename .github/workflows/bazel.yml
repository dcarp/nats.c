name: Bazel

on:
  pull_request:
  push:
    branches: [main, "release_*"]

permissions:
  contents: read

jobs:
  consumer:
    name: ${{ matrix.os }} / Bazel ${{ matrix.bazel }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel]
        bazel: [8.x]
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.bazel }}
          repository-cache: true
      - name: Compare integration timing with default and higher QoS
        shell: bash
        run: |
          tests=(
            //test:integration_natsNowAndSleep
            //test:integration_natsCondition
            //test:integration_AsyncSubscribeTimeout
            //test:integration_DrainConn
          )
          taskpolicy=$(command -v taskpolicy)
          overall_status=0
          for qos in default user-initiated; do
            echo "::group::Integration timing with QoS $qos"
            status=0
            bazel test \
              --test_output=all --verbose_failures \
              --copt=-isystem/usr/local/include \
              --run_under="$taskpolicy -l 0 -t 0" \
              --nocache_test_results --flaky_test_attempts=1 --test_env=CNATS_TEST_QOS="$qos" \
              "${tests[@]}" || status=$?
            echo "QoS $qos: Bazel exit code $status" >> "$GITHUB_STEP_SUMMARY"
            testlogs=$(bazel info bazel-testlogs | tr -d '\r')
            mkdir -p "integration-results/$qos"
            for result in "$testlogs"/test/integration_*; do
              if [[ -d "$result" ]]; then
                cp -RL "$result" "integration-results/$qos/"
              fi
            done
            echo "::endgroup::"
            if [[ "$status" -ne 0 ]]; then
              overall_status=1
            fi
          done
          exit "$overall_status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: integration-${{ matrix.os }}-qos-comparison
          path: integration-results
